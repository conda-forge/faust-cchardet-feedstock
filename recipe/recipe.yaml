context:
  name: faust-cchardet
  version: "2.2.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 324f886eeeb4b8dff4639f4f5e60a82481227c344ee0bfb490de017fbfe5f1b0

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - cython
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - setuptools
    - wheel
    - cython
    - pkgconfig
    - pip
  run:
    - python
  run_constraints:
    - cchardet <0

tests:
  - python:
      imports:
        - cchardet
      pip_check: true

about:
  summary: cChardet is high speed universal character encoding detector.
  license: GPL-3.0-only
  license_file:
    - COPYING
    - src/ext/uchardet/COPYING
  homepage: https://github.com/faust-streaming/cChardet

extra:
  recipe-maintainers:
    - hadim
